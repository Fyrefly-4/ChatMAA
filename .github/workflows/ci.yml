name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event.action != 'edited' || github.event.changes.base.ref != '') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-checks:
    name: offline-checks
    if: ${{ github.event.action != 'edited' || github.event.changes.base.ref != '' }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        id: node
      - uses: ./.github/actions/setup-python
        id: python
      - name: 文档链接检查
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/ci/check-doc-links.mjs
      - name: 文档检查器回归
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test scripts/ci/check-doc-links.test.mjs
      - name: Workflow 静态检查
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-workflows.ps1
      - name: Web 依赖与浏览器
        id: web
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          npm --prefix web ci --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web/node_modules/playwright/cli.js install chromium
      # Continue after a failed check, but never after failed setup or cancellation.
      - name: Backend 类型检查
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: npm --prefix backend run check
      - name: Backend 集成测试
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: npm --prefix backend test
      - name: Adapter 单元测试
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: '& ./adapter/maa/.venv/Scripts/python.exe -m unittest discover -s adapter/maa/tests -v'
      - name: Web 类型检查
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.web.outcome == 'success' }}
        run: npm --prefix web run check
      - name: Web 构建
        id: web-build
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.web.outcome == 'success' }}
        run: npm --prefix web run build
      - name: Web 浏览器检查
        id: web-tests
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.python.outcome == 'success' && steps.web.outcome == 'success' && steps.web-build.outcome == 'success' }}
        run: npm --prefix web run test:e2e
      - name: 保存浏览器失败产物
        if: ${{ !cancelled() && steps.web-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/checks/web-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
