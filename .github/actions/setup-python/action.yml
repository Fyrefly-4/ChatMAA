name: 固定 Python 环境
description: 安装固定 Python 与 pip，在 Backend 约定路径创建 Adapter venv
runs:
  using: composite
  steps:
    # setup-python has no Windows build for this security-only CPython release.
    # Keep the distribution and digest pinned together with .python-version.
    - name: 准备固定 Windows CPython
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $pythonVersion = (Get-Content .python-version -Raw).Trim()
        if (!$IsWindows -or $pythonVersion -ne '3.12.14') {
          throw '须同步固定 Windows CPython 安装包与 .python-version'
        }
        $pythonRoot = Join-Path $env:RUNNER_TEMP 'chatmaa-python-3.12.14'
        New-Item -ItemType Directory -Path $pythonRoot -ErrorAction Stop | Out-Null
        $archive = Join-Path $pythonRoot 'python.tar.gz'
        Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
        $expectedHash = 'e90c1b6419da3bd812dd73bb3de40287a21abf153438147639ec5e20375ea93f'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
          throw 'CPython 安装包 SHA-256 不匹配'
        }
        tar -xzf $archive -C $pythonRoot
        $pythonBin = Join-Path $pythonRoot 'python'
        & (Join-Path $pythonBin 'python.exe') -c "import platform,struct; assert platform.python_version()=='3.12.14'; assert struct.calcsize('P')==8"
        $pythonBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python -c "import pathlib,platform; expected=pathlib.Path('.python-version').read_text().strip(); assert platform.python_version()==expected; print('Python', expected)"
        Write-Output "Runner: $env:ImageOS / $env:ImageVersion"
        python -m venv adapter/maa/.venv
        $pipVersion = (Get-Content .pip-version -Raw).Trim()
        if ($pipVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'pip 必须指定精确版本' }
        & ./adapter/maa/.venv/Scripts/python.exe -m pip install --index-url https://pypi.org/simple "pip==$pipVersion"
        & ./adapter/maa/.venv/Scripts/python.exe -m pip --version
        & ./adapter/maa/.venv/Scripts/python.exe -m pip install --index-url https://pypi.org/simple -r adapter/maa/requirements.lock
        & ./adapter/maa/.venv/Scripts/python.exe -m pip check
